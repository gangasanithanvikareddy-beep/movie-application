<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <header>
    <h1>🎬 CineVault</h1>

    <div class="student-info">
        <p>Name: GANGASANI THANVIKA REDDY</p>

    </div>
</header>
    </header>

    <main>
        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search movies..."
            >
            <button onclick="searchMovies()">Search</button>
        </section>
<section id="movieDetails" class="movie-details"></section>
<section class="admin-section">
    <h2>Add a Movie</h2>

    <form id="movieForm">
        <input type="text" id="title" placeholder="Movie title" required>
        <input type="text" id="description" placeholder="Description" required>
        <input type="text" id="genre" placeholder="Genre" required>
        <input type="text" id="language" placeholder="Language" required>
        <input type="date" id="releaseDate" required>
        <input type="number" id="duration" placeholder="Duration (minutes)" required>
        <input type="number" id="rating" placeholder="Rating" step="0.1" min="0" max="10">

        <button type="submit">Add Movie</button>
    </form>
</section>
        <section>
            <h2>Movies</h2>
            <div id="movieContainer" class="movie-container"></div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
